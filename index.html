<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUR — DJ Live Sequencer</title>
  <meta name="description" content="GUR is a standalone DJ Live Sequencer for Windows and macOS — drum machine, polyphonic synthesizer, dual decks, live throw FX. From 21st Century Artisan.">
  <meta name="theme-color" content="#0b0f15">
  <meta property="og:title" content="GUR — DJ Live Sequencer">
  <meta property="og:description" content="A standalone DJ Live Sequencer for live performance. Coming soon from 21st Century Artisan.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0b0f15;
      --panel:      #141c26;
      --text:       #e6ecf2;
      --muted:      #8693a3;
      --accent:     #63d7d4;        /* matches kUiAccent in the app */
      --accent-dim: #63d7d433;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse at top, rgba(99,215,212,0.07), transparent 55%),
        radial-gradient(ellipse at bottom, rgba(99,215,212,0.04), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
    .logo {
      max-width: 360px;
      width: 70vw;
      height: auto;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 30px rgba(99,215,212,0.18));
    }
    .tagline {
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.18em;
      font-size: clamp(15px, 1.9vw, 20px);
      margin-bottom: 32px;
    }
    p.blurb {
      max-width: 560px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    .badge {
      display: inline-block;
      padding: 9px 20px;
      border: 1px solid var(--accent-dim);
      border-radius: 999px;
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.18em;
      font-size: 13px;
      margin-bottom: 44px;
    }
    a.contact {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
      padding-bottom: 2px;
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    a.contact:hover { border-color: var(--accent); }

    footer {
      margin-top: auto;
      padding-top: 80px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      line-height: 1.6;
    }
    footer .maker { color: var(--text); }
  </style>
</head>
<body>
  <img src="gur_logo.png" alt="GUR" class="logo">
  <div class="tagline">DJ LIVE SEQUENCER</div>

  <p class="blurb">
    A standalone instrument for live performance — drum machine, polyphonic
    synthesizer, dual decks, live throw FX, and a sample-accurate sequencer,
    in one Windows and macOS app.
  </p>

  <div class="badge">AVAILABLE SOON</div>

  <div>
    <a class="contact" href="mailto:nadavhd@gmail.com">nadavhd@gmail.com</a>
  </div>

  <footer>
    <div>&copy; 2026 <span class="maker">21st Century Artisan</span></div>
    <div>Built by Nadav Hecht Drayson</div>
  </footer>
</body>
</html>
